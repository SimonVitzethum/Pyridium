plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	if (project.hasProperty("pydRunDir")) {
		runs.named("client") { runDir(file(project.property("pydRunDir")).absolutePath) }
	}
	mods {
		"pyridium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// ---- Native Seite (Zig): Pyrit + libpyridium.so ----
// native/pyrit ist ein Schnappschuss von ~/Schreibtisch/Pyrit (dort wird nichts veraendert).
// CUDA-only by default. DLSS (including Vulkan frame-generation interop)
// is linked only when explicitly requested with -PdlssSdk=<path>.
def nativeSrc = file("native/pyrit")
def nativeOut = file("$buildDir/native")
def dlssSdk = project.findProperty("dlssSdk")
tasks.register("buildNative", Exec) {
	inputs.property("dlssSdk", dlssSdk ?: "disabled")
	inputs.files(fileTree(nativeSrc) { exclude '.zig-cache/**', 'zig-out/**' }).withPropertyName("src").skipWhenEmpty(false)
	outputs.file("$nativeOut/libpyridium.so")
	workingDir nativeSrc
	def cmd = ["zig", "build", "pyridium", "--release=fast", "--prefix", nativeOut.absolutePath, "--prefix-lib-dir", nativeOut.absolutePath]
	if (dlssSdk != null) cmd.add("-Ddlss-sdk=" + dlssSdk)
	commandLine cmd
}
processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") { expand(version: project.version) }
	dependsOn("buildNative")
	from(nativeOut) {
		include "libpyridium.so"
		into "natives/linux-x86_64"
	}
}
tasks.named("runClient") {
	dependsOn("buildNative")
	jvmArgs("-Dpyridium.nativeDir=${nativeOut}", "--enable-native-access=ALL-UNNAMED")
	if (project.hasProperty("quickWorld")) {
		args("--quickPlaySingleplayer", project.property("quickWorld"))
	}
	if (project.hasProperty("pydSize")) {
		def wh = project.property("pydSize").toString().split("x")
		args("--width", wh[0], "--height", wh[1])
	}
	if (project.hasProperty("pydJvm")) {
		jvmArgs(project.property("pydJvm").toString().split(" "))
	}
}

// Dedizierter Server fuer Worldgen-Messungen: -PpydServerJvm="-Dpyridium.genBench=64 ..."
tasks.named("runServer") {
	jvmArgs("--enable-native-access=ALL-UNNAMED")
	if (project.hasProperty("pydServerJvm")) {
		jvmArgs(project.property("pydServerJvm").toString().split(" "))
	}
}

// ---- CUDA-Kernels der exakten Worldgen (Server-Seite) ----
// nvcc -ptx mit Exaktheits-Flags (kein FMA-Zusammenziehen, IEEE-Division/Wurzel, keine
// Denormal-Spuelung), damit die GPU bitgleich zu Vanilla rechnet. Die .cu-Quellen liegen zusaetzlich
// im Jar (NVRTC-Codegen in ExactCudaGen). Ohne nvcc wird uebersprungen (GPU-Terrain dann aus, Vanilla rechnet).
def cudaSrc = file("src/main/resources/assets/pyridium/cuda")
def cudaOut = file("$buildDir/cuda")
def findExecutable = { String name ->
	for (dir in (System.getenv("PATH") ?: "").split(File.pathSeparator)) {
		def f = new File(dir, name)
		if (f.canExecute()) return f.absolutePath
	}
	def home = System.getenv("CUDA_PATH")
	for (p in [home ? "$home/bin/$name" : null, "/opt/cuda/bin/$name", "/usr/local/cuda/bin/$name"]) {
		if (p != null && new File(p).canExecute()) return p
	}
	return null
}
tasks.register("compileCuda") {
	inputs.dir(cudaSrc)
	outputs.dir(cudaOut)
	doLast {
		cudaOut.deleteDir()
		cudaOut.mkdirs()
		def nvcc = findExecutable("nvcc")
		if (nvcc == null) {
			logger.warn("nvcc nicht gefunden – CUDA-Kernels entfallen (Worldgen rechnet Vanilla)")
			return
		}
		def units = cudaSrc.listFiles().findAll { it.name.endsWith(".cu") }
		def pool = java.util.concurrent.Executors.newFixedThreadPool(Math.max(1, Runtime.runtime.availableProcessors()))
		try {
			def futures = units.collect { f ->
				pool.submit({
					// -Pcubin[=75,120]: Fatbin (PTX compute_75 + fertiger SASS je Architektur) statt reinem PTX. Der Treiber muss dann nicht beim
					// ersten Laden jeden Kernel uebersetzen (JIT: ~30 s je grossem Modul, nur einmal je PTX-Hash, aber bei jeder Neuinstallation).
					def sasm = project.hasProperty("cubin") ? (project.property("cubin").toString() == "true" ? "75,80,86,89,90,120" : project.property("cubin").toString()).split(",") : null
					def arch = sasm == null ? ["-ptx", "-arch=compute_75"] : (["-fatbin", "-gencode", "arch=compute_75,code=compute_75"] + sasm.findAll { it != "75" || true }.collectMany { a -> ["-gencode", "arch=compute_${a},code=sm_${a}"] })
					def cmd = ([nvcc] + arch + ["-std=c++17", "-fmad=false", "-prec-div=true", "-prec-sqrt=true", "-ftz=false",
						"-I" + cudaSrc, "-o", new File(cudaOut, (f.name - ".cu") + ".ptx").toString(), f.toString()]).collect { it.toString() }
					def proc = new ProcessBuilder(cmd as List<String>).redirectErrorStream(true).start()
					def log = proc.inputStream.text
					proc.waitFor()
					if (proc.exitValue() != 0) throw new RuntimeException("nvcc ${f.name}:\n" + log)
					return log
				} as java.util.concurrent.Callable)
			}
			futures.each { it.get() }
		} finally {
			pool.shutdown()
		}
	}
}
processResources {
	dependsOn("compileCuda")
	from(cudaOut) { into "assets/pyridium/shaders/ptx" }
}

// ---- Strukturgenerierung: Testwerkzeug (Vanilla-Vergleich, nur Entwicklung) ----
// ./gradlew structHarness -Pmode=place -Pseed=4711 -Pradius=300   (Ausgaben in build/scratch)
tasks.register("structHarness", JavaExec) {
	dependsOn("classes", "compileCuda")
	classpath = sourceSets.main.output.classesDirs + configurations.runtimeClasspath
	mainClass = "simon.pyridium.worldgen.structures.tools.StructureHarness"
	workingDir = projectDir
	jvmArgs("--enable-native-access=ALL-UNNAMED", "-Xmx3g")
	["mode", "seed", "radius", "count", "structure", "out", "slots", "capStart", "capPieces", "dim", "module", "sets", "real", "pick", "nbt", "strict"].each { k ->
		if (project.hasProperty(k)) systemProperty(k, project.property(k).toString())
	}
}

// ---- Datenpaket: Vanilla-Bauanweisungen -> mitgelieferte Daten (Offline-Werkzeug, Ausgabe wird committet) ----
tasks.register("exportPack", JavaExec) {
	dependsOn("classes")
	classpath = sourceSets.main.output.classesDirs + configurations.runtimeClasspath
	mainClass = "simon.pyridium.worldgen.structures.PackExporter"
	workingDir = projectDir
}

// Nur ein GPU-Lauf zur Zeit (8 GB VRAM, mehrere Agenten): jeder JavaExec (Client, Server, Harnesse, Benches) nimmt vor dem Start die
// gemeinsame Sperrdatei im Haupt-Checkout (gilt auch aus Worktrees) und gibt sie danach wieder frei. Haelt der Aufrufer sie schon
// (tools/check_renderer.sh uebergibt -PgpuLockHeld), wird nicht doppelt gesperrt.
def gpuCommonGit = ["git", "-C", projectDir.absolutePath, "rev-parse", "--path-format=absolute", "--git-common-dir"].execute().text.trim()
def gpuLockFile = new File(gpuCommonGit ? new File(gpuCommonGit).parentFile : projectDir, "build/gpu-test.lock")
def gpuHeld = []
def gpuRelease = tasks.register("gpuLockRelease") {
	doLast {
		gpuHeld.each { h -> h[1].release(); h[0].close() }
		gpuHeld.clear()
	}
}
tasks.withType(JavaExec).configureEach { t ->
	if (project.hasProperty("gpuLockHeld")) return
	t.doFirst {
		gpuLockFile.parentFile.mkdirs()
		def ch = java.nio.channels.FileChannel.open(gpuLockFile.toPath(), java.nio.file.StandardOpenOption.CREATE, java.nio.file.StandardOpenOption.WRITE)
		logger.lifecycle("GPU-Sperre: warte auf andere GPU-Laeufe ...")
		gpuHeld << [ch, ch.lock()]
	}
	t.finalizedBy(gpuRelease)
}
